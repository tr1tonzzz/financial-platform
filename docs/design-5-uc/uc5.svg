<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" aria-label="Phân tích cổ tức tiền mặt"><style>text{font-family:"Be Vietnam Pro","Segoe UI",Arial,sans-serif}[data-screen]:hover{opacity:.8}</style><g id="uc5"><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F3F6F7"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#122F37"/><rect x="24" y="16" width="32" height="32" rx="8" fill="#126B59"/><text x="40" y="39" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">F</text><text x="70" y="40" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="start">NỀN TẢNG TÀI CHÍNH</text><text x="1000" y="39" font-size="12" fill="#BED1D7" font-weight="400" text-anchor="start">HPG / VNM / FPT</text><rect x="1150" y="20" width="112" height="26" rx="13" fill="#E6F4EE"/><text x="1161" y="38" font-size="11" fill="#126B59" font-weight="600" text-anchor="start">Bản thiết kế</text><text x="1355" y="40" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="start">Cá nhân</text><rect x="0" y="64" width="216" height="1016" rx="0" fill="#FFFFFF"/><line x1="216" y1="64" x2="216" y2="1080" stroke="#DCE5E8" stroke-width="1"/><text x="24" y="109" font-size="10" fill="#64767E" font-weight="600" text-anchor="start">KHÔNG GIAN NGHIÊN CỨU</text><g id="nav-uc5-1" data-screen="uc1" role="button" tabindex="0" aria-label="Mở uc1" style="cursor:pointer"><rect x="12" y="132" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="160" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">01</text><text x="54" y="160" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">Dữ liệu tài chính</text></g><g id="nav-uc5-2" data-screen="uc2" role="button" tabindex="0" aria-label="Mở uc2" style="cursor:pointer"><rect x="12" y="188" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="216" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">02</text><text x="54" y="216" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">Phân tích tài chính</text></g><g id="nav-uc5-3" data-screen="uc3" role="button" tabindex="0" aria-label="Mở uc3" style="cursor:pointer"><rect x="12" y="244" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="272" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">03</text><text x="54" y="272" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">So sánh doanh nghiệp</text></g><g id="nav-uc5-4" data-screen="uc4" role="button" tabindex="0" aria-label="Mở uc4" style="cursor:pointer"><rect x="12" y="300" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="328" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">04</text><text x="54" y="328" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">Theo dõi doanh nghiệp</text></g><g id="nav-uc5-5" data-screen="uc5" role="button" tabindex="0" aria-label="Mở uc5" style="cursor:pointer"><rect x="12" y="356" width="192" height="44" rx="8" fill="#E6F4EE"/><text x="27" y="384" font-size="12" fill="#126B59" font-weight="600" text-anchor="start">05</text><text x="54" y="384" font-size="12" fill="#126B59" font-weight="600" text-anchor="start">Phân tích cổ tức</text></g><line x1="24" y1="434" x2="192" y2="434" stroke="#DCE5E8" stroke-width="1"/><text x="24" y="467" font-size="10" fill="#64767E" font-weight="600" text-anchor="start">DỮ LIỆU HỖ TRỢ</text><g id="review-nav-uc5" data-screen="review" role="button" tabindex="0" aria-label="Mở review" style="cursor:pointer"><text x="24" y="502" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Duyệt và tra soát số liệu</text></g><g id="saved-nav-uc5" data-screen="saved" role="button" tabindex="0" aria-label="Mở saved" style="cursor:pointer"><text x="24" y="538" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Phân tích đã lưu</text></g><rect x="16" y="893" width="184" height="116" rx="10" fill="#F3F6F7"/><text x="30" y="921" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Mẫu nghiên cứu</text><text x="30" y="946" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">3 doanh nghiệp</text><text x="30" y="971" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">BCTC năm 2023–2025</text><text x="248" y="98" font-size="11" fill="#64767E" font-weight="600" text-anchor="start">UC-05  /  Phân tích cổ tức</text><text x="248" y="145" font-size="29" fill="#182F39" font-weight="600" text-anchor="start">Phân tích cổ tức tiền mặt</text><text x="248" y="176" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Đọc năm lợi nhuận, các đợt cấu thành và bối cảnh dòng tiền cùng nguồn.</text><line x1="248" y1="1031" x2="1404" y2="1031" stroke="#DCE5E8" stroke-width="1"/><text x="248" y="1058" font-size="12" fill="#865A14" font-weight="500" text-anchor="start">DỮ LIỆU MINH HỌA · Số liệu giả định, chưa đối chiếu nguồn doanh nghiệp.</text><text x="1404" y="1058" font-size="11" fill="#64767E" font-weight="400" text-anchor="end">Thiết kế đề xuất · chưa triển khai</text><rect x="248" y="202" width="1156" height="64" rx="10" fill="#FFFFFF" stroke="#DCE5E8"/><rect x="264" y="214" width="285" height="40" rx="7" fill="#F3F6F7"/><text x="278" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">HPG · Hòa Phát</text><rect x="565" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="579" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">2023 — 2025</text><rect x="771" y="214" width="226" height="40" rx="7" fill="#F3F6F7"/><text x="785" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">BCTC năm · Hợp nhất</text><rect x="1013" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="1027" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">Đơn vị: tỷ đồng</text><text x="1378" y="239" font-size="12" fill="#126B59" font-weight="600" text-anchor="end">Đổi bộ chọn</text><rect x="248" y="290" width="680" height="311" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="270" y="322" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Lịch sử DPS theo năm lợi nhuận · đồng/cổ phiếu</text><rect x="352" y="430.0" width="66" height="100.0" rx="5" fill="#126B59"/><text x="385" y="415.0" font-size="17" fill="#182F39" font-weight="600" text-anchor="middle">1.200</text><text x="385" y="559" font-size="12" fill="#64767E" font-weight="400" text-anchor="middle">2023</text><rect x="532" y="405.0" width="66" height="125.0" rx="5" fill="#126B59"/><text x="565" y="390.0" font-size="17" fill="#182F39" font-weight="600" text-anchor="middle">1.500</text><text x="565" y="559" font-size="12" fill="#64767E" font-weight="400" text-anchor="middle">2024</text><rect x="712" y="380.0" width="66" height="150.0" rx="5" fill="#B6CFC6"/><text x="745" y="365.0" font-size="17" fill="#182F39" font-weight="600" text-anchor="middle">1.800</text><text x="745" y="559" font-size="12" fill="#64767E" font-weight="400" text-anchor="middle">2025</text><text x="270" y="585" font-size="12" fill="#865A14" font-weight="400" text-anchor="start">DPS gốc; 2025 là mức quan sát, chưa xác nhận đầy đủ.</text><rect x="948" y="290" width="456" height="311" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="970" y="322" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Độ đầy đủ và cơ sở so sánh</text><rect x="970" y="353" width="210" height="26" rx="13" fill="#FFF3DA"/><text x="981" y="371" font-size="11" fill="#865A14" font-weight="600" text-anchor="start">2025: còn thiếu nguồn</text><text x="970" y="412" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Còn cần kiểm các đợt thuộc lợi nhuận 2025.</text><text x="970" y="442" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Có sự kiện cổ phiếu cần xác minh hiệu lực.</text><text x="970" y="472" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Chưa tính tăng trưởng DPS hoặc payout.</text><g id="action-86" data-screen="basis" role="button" tabindex="0" aria-label="Mở basis" style="cursor:pointer"><rect x="970" y="527" width="412" height="40" rx="8" fill="#126B59"/><text x="1176.0" y="553" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Kiểm cơ sở cổ phiếu và DPS</text></g><rect x="248" y="621" width="1156" height="183" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="270" y="653" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Các đợt cổ tức và trạng thái</text><rect x="268" y="674" width="1116" height="42" rx="6" fill="#F3F6F7"/><g id="cell-93"><text x="282" y="701" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Năm lợi nhuận</text></g><g id="cell-96"><text x="454" y="701" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Đợt / loại</text></g><g id="cell-99"><text x="706" y="701" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">DPS quan sát</text></g><g id="cell-102"><text x="876" y="701" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Lịch thanh toán</text></g><g id="cell-105"><text x="1111" y="701" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Trạng thái</text></g><g id="cell-108"><text x="282" y="746" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">2025</text></g><g id="cell-111"><text x="454" y="746" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Đợt 1 · tiền mặt</text></g><g id="cell-114"><text x="706" y="746" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">1.000 đ/cp</text></g><g id="cell-117"><text x="876" y="746" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Lịch theo thông báo</text></g><g id="cell-120"><text x="1111" y="746" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Chưa xác nhận trả</text></g><line x1="268" y1="754" x2="1384" y2="754" stroke="#DCE5E8" stroke-width="1"/><g id="cell-124"><text x="282" y="784" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">2025</text></g><g id="cell-127"><text x="454" y="784" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Đợt 2 · tiền mặt</text></g><g id="cell-130"><text x="706" y="784" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">800 đ/cp</text></g><g id="cell-133"><text x="876" y="784" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Cần kiểm bản sửa</text></g><g id="cell-136"><text x="1111" y="784" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Còn thiếu nguồn</text></g><line x1="268" y1="792" x2="1384" y2="792" stroke="#DCE5E8" stroke-width="1"/><rect x="248" y="824" width="746" height="179" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="270" y="856" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Bối cảnh dòng tiền năm 2025 · tỷ đồng</text><text x="270" y="879" font-size="14" fill="#64767E" font-weight="400" text-anchor="start">CFO 16.000 − CAPEX 8.000 = 8.000</text><text x="270" y="909" font-size="14" fill="#64767E" font-weight="400" text-anchor="start">Trừ khoản phân phối đã chi 10.000 → còn −2.000</text><text x="270" y="939" font-size="14" fill="#64767E" font-weight="400" text-anchor="start">Khoản chi trên BCLCTT khác DPS trong thông báo.</text><g id="action-145" data-screen="source" role="button" tabindex="0" aria-label="Mở source" style="cursor:pointer"><rect x="1030" y="835" width="374" height="40" rx="8" fill="#FFFFFF" stroke="#DCE5E8"/><text x="1217.0" y="861" font-size="13" fill="#182F39" font-weight="600" text-anchor="middle">Xem nguồn khoản chi và công thức</text></g><g id="action-149" data-screen="bridge" role="button" tabindex="0" aria-label="Mở bridge" style="cursor:pointer"><rect x="1030" y="891" width="374" height="40" rx="8" fill="#FFFFFF" stroke="#DCE5E8"/><text x="1217.0" y="917" font-size="13" fill="#182F39" font-weight="600" text-anchor="middle">Đọc cầu nối CFO</text></g><g id="action-153" data-screen="saved" role="button" tabindex="0" aria-label="Mở saved" style="cursor:pointer"><rect x="1030" y="947" width="374" height="40" rx="8" fill="#126B59"/><text x="1217.0" y="973" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Lưu hồ sơ nhận xét cổ tức</text></g></g></svg>