<text x="30" y="921" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Mẫu nghiên cứu</text><text x="30" y="946" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">3 doanh nghiệp</text><text x="30" y="971" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">BCTC năm 2023–2025</text><text x="248" y="98" font-size="11" fill="#64767E" font-weight="600" text-anchor="start">UC-02  /  Phân tích tài chính</text><text x="248" y="145" font-size="29" fill="#182F39" font-weight="600" text-anchor="start">Phân tích dữ liệu tài chính</text><text x="248" y="176" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Xem xu hướng, đọc công thức và tìm hiểu những khoản đóng góp vào dòng tiền.</text><line x1="248" y1="1031" x2="1404" y2="1031" stroke="#DCE5E8" stroke-width="1"/><text x="248" y="1058" font-size="12" fill="#865A14" font-weight="500" text-anchor="start">DỮ LIỆU MINH HỌA · Số liệu giả định, chưa đối chiếu nguồn doanh nghiệp.</text><text x="1404" y="1058" font-size="11" fill="#64767E" font-weight="400" text-anchor="end">Thiết kế đề xuất · chưa triển khai</text><rect x="248" y="202" width="1156" height="64" rx="10" fill="#FFFFFF" stroke="#DCE5E8"/><rect x="264" y="214" width="285" height="40" rx="7" fill="#F3F6F7"/><text x="278" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">HPG · Hòa Phát</text><rect x="565" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="579" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">2023 — 2025</text><rect x="771" y="214" width="226" height="40" rx="7" fill="#F3F6F7"/><text x="785" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">BCTC năm · Hợp nhất</text><rect x="1013" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="1027" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">Đơn vị: tỷ đồng</text><text x="1378" y="239" font-size="12" fill="#126B59" font-weight="600" text-anchor="end">Đổi bộ chọn</text><rect x="248" y="290" width="748" height="394" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="270" y="322" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Lợi nhuận và dòng tiền kinh doanh</text><text x="270" y="350" font-size="11" fill="#64767E" font-weight="400" text-anchor="start">Tỷ đồng</text><line x1="310" y1="602" x2="958" y2="602" stroke="#DCE5E8" stroke-width="1"/><text x="295" y="606" font-size="10" fill="#64767E" font-weight="400" text-anchor="end">0</text><line x1="310" y1="552" x2="958" y2="552" stroke="#DCE5E8" stroke-width="1"/><text x="295" y="556" font-size="10" fill="#64767E" font-weight="400" text-anchor="end">5000</text><line x1="310" y1="502" x2="958" y2="502" stroke="#DCE5E8" stroke-width="1"/><text x="295" y="506" font-size="10" fill="#64767E" font-weight="400" text-anchor="end">10000</text><line x1="310" y1="452" x2="958" y2="452" stroke="#DCE5E8" stroke-width="1"/><text x="295" y="456" font-size="10" fill="#64767E" font-weight="400" text-anchor="end">15000</text><line x1="310" y1="402" x2="958" y2="402" stroke="#DCE5E8" stroke-width="1"/><text x="295" y="406" font-size="10" fill="#64767E" font-weight="400" text-anchor="end">20000</text><text x="380" y="630" font-size="12" fill="#64767E" font-weight="400" text-anchor="middle">2023</text><text x="630" y="630" font-size="12" fill="#64767E" font-weight="400" text-anchor="middle">2024</text><text x="880" y="630" font-size="12" fill="#64767E" font-weight="400" text-anchor="middle">2025</text><polyline points="380,542 630,512 880,482" fill="none" stroke="#126B59" stroke-width="3"/><circle cx="380" cy="542" r="5" fill="#126B59"/><circle cx="630" cy="512" r="5" fill="#126B59"/><circle cx="880" cy="482" r="5" fill="#126B59"/><polyline points="380,522 630,532 880,442" fill="none" stroke="#4168C8" stroke-width="3"/><circle cx="380" cy="522" r="5" fill="#4168C8"/><circle cx="630" cy="532" r="5" fill="#4168C8"/><circle cx="880" 