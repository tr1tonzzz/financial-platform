nchor="start">Đọc các dòng điều chỉnh và vốn lưu động để hiểu sự khác biệt.</text><g id="action-111" data-screen="bridge" role="button" tabindex="0" aria-label="Mở bridge" style="cursor:pointer"><rect x="248" y="877" width="253" height="40" rx="8" fill="#126B59"/><text x="374.5" y="903" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Đọc cầu nối LNTT → CFO</text></g><g id="action-115" data-screen="uc3" role="button" tabindex="0" aria-label="Mở uc3" style="cursor:pointer"><rect x="519" y="877" width="218" height="40" rx="8" fill="#FFFFFF" stroke="#DCE5E8"/><text x="628.0" y="903" font-size="13" fill="#182F39" font-weight="600" text-anchor="middle">So sánh doanh nghiệp</text></g><g id="action-119" data-screen="saved" role="button" tabindex="0" aria-label="Mở saved" style="cursor:pointer"><rect x="1120" y="877" width="284" height="40" rx="8" fill="#FFFFFF" stroke="#DCE5E8"/><text x="1262.0" y="903" font-size="13" fill="#182F39" font-weight="600" text-anchor="middle">Lưu nhận xét và bằng chứng</text></g><text x="248" y="965" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Thiếu kỳ hoặc mẫu số không hợp lệ: hiện lý do và chặn phép tính liên quan.</text></g></svg>