="30" y="921" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Mẫu nghiên cứu</text><text x="30" y="946" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">3 doanh nghiệp</text><text x="30" y="971" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">BCTC năm 2023–2025</text><text x="248" y="98" font-size="11" fill="#64767E" font-weight="600" text-anchor="start">UC-03  /  So sánh doanh nghiệp</text><text x="248" y="145" font-size="29" fill="#182F39" font-weight="600" text-anchor="start">So sánh doanh nghiệp</text><text x="248" y="176" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Đối chiếu nhóm doanh nghiệp bạn tự chọn trên cùng kỳ và phạm vi báo cáo.</text><line x1="248" y1="1031" x2="1404" y2="1031" stroke="#DCE5E8" stroke-width="1"/><text x="248" y="1058" font-size="12" fill="#865A14" font-weight="500" text-anchor="start">DỮ LIỆU MINH HỌA · Số liệu giả định, chưa đối chiếu nguồn doanh nghiệp.</text><text x="1404" y="1058" font-size="11" fill="#64767E" font-weight="400" text-anchor="end">Thiết kế đề xuất · chưa triển khai</text><rect x="248" y="202" width="1156" height="64" rx="10" fill="#FFFFFF" stroke="#DCE5E8"/><rect x="264" y="214" width="285" height="40" rx="7" fill="#F3F6F7"/><text x="278" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">HPG  +  VNM  +  FPT</text><rect x="565" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="579" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">Năm 2025</text><rect x="771" y="214" width="226" height="40" rx="7" fill="#F3F6F7"/><text x="785" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">BCTC năm · Hợp nhất</text><rect x="1013" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="1027" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">Đơn vị: tỷ đồng</text><text x="1378" y="239" font-size="12" fill="#126B59" font-weight="600" text-anchor="end">Đổi bộ chọn</text><rect x="248" y="290" width="1156" height="58" rx="10" fill="#FFF3DA"/><text x="270" y="325" font-size="13" fill="#865A14" font-weight="400" text-anchor="start">Ba doanh nghiệp khác ngành. Kết quả là đối chiếu nhóm tự chọn, không phải chuẩn so sánh ngành.</text><rect x="248" y="369" width="1156" height="347" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="270" y="401" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Số liệu và tỷ số trên cùng cơ sở</text><rect x="268" y="423" width="1116" height="42" rx="6" fill="#F3F6F7"/><g id="cell-72"><text x="282" y="450" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Chỉ tiêu</text></g><g id="cell-75"><text x="636" y="450" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">HPG · Hòa Phát</text></g><g id="cell-78"><text x="890" y="450" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">VNM · Vinamilk</text></g><g id="cell-81"><text x="1144" y="450" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">FPT</text></g><g id="cell-84"><text x="282" y="495" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">Tổng LNST · tỷ đồng</text></g><g id="cell-87" data-screen="source" role="button" tabindex="0" aria-label="Mở source" style="cursor:pointer"><text x="636" y="495" font-size="14" fill="#126B59" font-weight="400" text-anchor="start">12.000</text></g><g id="cell-90"><text x="890" y="495" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">10.000</text></g><g id="cell-93"><text x="1144" y="495" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">9.000</text></g><line x1="268" y1="508" x2="1384" y2="508" stroke="#DCE5E8" stroke-width="1"/><g id="cell-97"><text x="282" y="538" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">CFO · tỷ đồng</text></g><g id="cell-100" data-screen="source" role="button" tabindex="0" aria-label="Mở source" style=