<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" aria-label="Cầu nối lợi nhuận trước thuế → CFO"><style>text{font-family:"Be Vietnam Pro","Segoe UI",Arial,sans-serif}[data-screen]:hover{opacity:.8}</style><g id="bridge"><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F3F6F7"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#122F37"/><rect x="24" y="16" width="32" height="32" rx="8" fill="#126B59"/><text x="40" y="39" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">F</text><text x="70" y="40" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="start">NỀN TẢNG TÀI CHÍNH</text><text x="1000" y="39" font-size="12" fill="#BED1D7" font-weight="400" text-anchor="start">HPG / VNM / FPT</text><rect x="1150" y="20" width="112" height="26" rx="13" fill="#E6F4EE"/><text x="1161" y="38" font-size="11" fill="#126B59" font-weight="600" text-anchor="start">Bản thiết kế</text><text x="1355" y="40" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="start">Cá nhân</text><rect x="0" y="64" width="216" height="1016" rx="0" fill="#FFFFFF"/><line x1="216" y1="64" x2="216" y2="1080" stroke="#DCE5E8" stroke-width="1"/><text x="24" y="109" font-size="10" fill="#64767E" font-weight="600" text-anchor="start">KHÔNG GIAN NGHIÊN CỨU</text><g id="nav-bridge-1" data-screen="uc1" role="button" tabindex="0" aria-label="Mở uc1" style="cursor:pointer"><rect x="12" y="132" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="160" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">01</text><text x="54" y="160" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">Dữ liệu tài chính</text></g><g id="nav-bridge-2" data-screen="uc2" role="button" tabindex="0" aria-label="Mở uc2" style="cursor:pointer"><rect x="12" y="188" width="192" height="44" rx="8" fill="#E6F4EE"/><text x="27" y="216" font-size="12" fill="#126B59" font-weight="600" text-anchor="start">02</text><text x="54" y="216" font-size="12" fill="#126B59" font-weight="600" text-anchor="start">Phân tích tài chính</text></g><g id="nav-bridge-3" data-screen="uc3" role="button" tabindex="0" aria-label="Mở uc3" style="cursor:pointer"><rect x="12" y="244" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="272" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">03</text><text x="54" y="272" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">So sánh doanh nghiệp</text></g><g id="nav-bridge-4" data-screen="uc4" role="button" tabindex="0" aria-label="Mở uc4" style="cursor:pointer"><rect x="12" y="300" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="328" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">04</text><text x="54" y="328" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">Theo dõi doanh nghiệp</text></g><g id="nav-bridge-5" data-screen="uc5" role="button" tabindex="0" aria-label="Mở uc5" style="cursor:pointer"><rect x="12" y="356" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="384" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">05</text><text x="54" y="384" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">Phân tích cổ tức</text></g><line x1="24" y1="434" x2="192" y2="434" stroke="#DCE5E8" stroke-width="1"/><text x="24" y="467" font-size="10" fill="#64767E" font-weight="600" text-anchor="start">DỮ LIỆU HỖ TRỢ</text><g id="review-nav-bridge" data-screen="review" role="button" tabindex="0" aria-label="Mở review" style="cursor:pointer"><text x="24" y="502" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Duyệt và tra soát số liệu</text></g><g id="saved-nav-bridge" data-screen="saved" role="button" tabindex="0" aria-label="Mở saved" style="cursor:pointer"><text x="24" y="538" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Phân tích đã lưu</text></g><rect x="16" y="893" width="184" height="116" rx="10" fill="#F3F6F7"/><text x="30" y="921" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Mẫu nghiên cứu</text><text x="30" y="946" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">3 doanh nghiệp</text><text x="30" y="971" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">BCTC năm 2023–2025</text><text x="248" y="98" font-size="11" fill="#64767E" font-weight="600" text-anchor="start">CHI TIẾT  /  Phân tích tài chính</text><text x="248" y="145" font-size="29" fill="#182F39" font-weight="600" text-anchor="start">Cầu nối lợi nhuận trước thuế → CFO</text><text x="248" y="176" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Đọc các dòng đóng góp, phần còn lệch và nguồn; không ép số khớp bằng dòng bù.</text><line x1="248" y1="1031" x2="1404" y2="1031" stroke="#DCE5E8" stroke-width="1"/><text x="248" y="1058" font-size="12" fill="#865A14" font-weight="500" text-anchor="start">DỮ LIỆU MINH HỌA · Số liệu giả định, chưa đối chiếu nguồn doanh nghiệp.</text><text x="1404" y="1058" font-size="11" fill="#64767E" font-weight="400" text-anchor="end">Thiết kế đề xuất · chưa triển khai</text><rect x="248" y="202" width="1156" height="64" rx="10" fill="#FFFFFF" stroke="#DCE5E8"/><rect x="264" y="214" width="285" height="40" rx="7" fill="#F3F6F7"/><text x="278" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">HPG · Hòa Phát</text><rect x="565" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="579" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">Năm 2025</text><rect x="771" y="214" width="226" height="40" rx="7" fill="#F3F6F7"/><text x="785" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">BCTC năm · Hợp nhất</text><rect x="1013" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="1027" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">Đơn vị: tỷ đồng</text><text x="1378" y="239" font-size="12" fill="#126B59" font-weight="600" text-anchor="end">Đổi bộ chọn</text><rect x="248" y="290" width="1156" height="352" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="270" y="322" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Các khoản cấu thành · tỷ đồng</text><rect x="350" y="427" width="66" height="150" rx="4" fill="#126B59"/><text x="383" y="412" font-size="16" fill="#182F39" font-weight="600" text-anchor="middle">15.000</text><text x="383" y="609" font-size="12" fill="#64767E" font-weight="400" text-anchor="middle">LNTT</text><line x1="416" y1="427" x2="556" y2="427" stroke="#64767E" stroke-width="1"/><rect x="556" y="387" width="66" height="40" rx="4" fill="#4168C8"/><text x="589" y="372" font-size="16" fill="#182F39" font-weight="600" text-anchor="middle">+4.000</text><text x="589" y="609" font-size="12" fill="#64767E" font-weight="400" text-anchor="middle">Phi tiền</text><line x1="622" y1="387" x2="762" y2="387" stroke="#64767E" stroke-width="1"/><rect x="762" y="387" width="66" height="20" rx="4" fill="#AE453B"/><text x="795" y="372" font-size="16" fill="#182F39" font-weight="600" text-anchor="middle">−2.000</text><text x="795" y="609" font-size="12" fill="#64767E" font-weight="400" text-anchor="middle">Vốn lưu động</text><line x1="828" y1="407" x2="968" y2="407" stroke="#64767E" stroke-width="1"/><rect x="968" y="407" width="66" height="10" rx="4" fill="#AE453B"/><text x="1001" y="392" font-size="16" fill="#182F39" font-weight="600" text-anchor="middle">−1.000</text><text x="1001" y="609" font-size="12" fill="#64767E" font-weight="400" text-anchor="middle">Khoản khác</text><line x1="1034" y1="417" x2="1174" y2="417" stroke="#64767E" stroke-width="1"/><rect x="1174" y="417" width="66" height="160" rx="4" fill="#126B59"/><text x="1207" y="402" font-size="16" fill="#182F39" font-weight="600" text-anchor="middle">16.000</text><text x="1207" y="609" font-size="12" fill="#64767E" font-weight="400" text-anchor="middle">CFO</text><rect x="1162" y="311" width="215" height="26" rx="13" fill="#E6F4EE"/><text x="1173" y="329" font-size="11" fill="#126B59" font-weight="600" text-anchor="start">Residual: 0</text><rect x="248" y="662" width="748" height="340" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="270" y="694" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Dòng nguồn và vai trò trong cầu nối</text><rect x="268" y="718" width="708" height="42" rx="6" fill="#F3F6F7"/><g id="cell-93"><text x="282" y="745" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Nhóm</text></g><g id="cell-96"><text x="632" y="745" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Tác động</text></g><g id="cell-99"><text x="782" y="745" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Vai trò</text></g><g id="cell-102"><text x="282" y="790" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">Điểm đầu LNTT</text></g><g id="cell-105"><text x="632" y="790" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">15.000</text></g><g id="cell-108"><text x="782" y="790" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Điểm đầu</text></g><line x1="268" y1="804" x2="976" y2="804" stroke="#DCE5E8" stroke-width="1"/><g id="cell-112"><text x="282" y="834" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">Điều chỉnh phi tiền</text></g><g id="cell-115"><text x="632" y="834" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">+4.000</text></g><g id="cell-118"><text x="782" y="834" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Dòng cấu thành</text></g><line x1="268" y1="848" x2="976" y2="848" stroke="#DCE5E8" stroke-width="1"/><g id="cell-122"><text x="282" y="878" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">Thay đổi vốn lưu động</text></g><g id="cell-125" data-screen="source" role="button" tabindex="0" aria-label="Mở source" style="cursor:pointer"><text x="632" y="878" font-size="14" fill="#126B59" font-weight="400" text-anchor="start">−2.000</text></g><g id="cell-128"><text x="782" y="878" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Dòng cấu thành</text></g><line x1="268" y1="892" x2="976" y2="892" stroke="#DCE5E8" stroke-width="1"/><g id="cell-132"><text x="282" y="922" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">Các khoản khác</text></g><g id="cell-135"><text x="632" y="922" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">−1.000</text></g><g id="cell-138"><text x="782" y="922" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Dòng cấu thành</text></g><line x1="268" y1="936" x2="976" y2="936" stroke="#DCE5E8" stroke-width="1"/><g id="cell-142"><text x="282" y="966" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">CFO cuối</text></g><g id="cell-145"><text x="632" y="966" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">16.000</text></g><g id="cell-148"><text x="782" y="966" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Điểm cuối</text></g><line x1="268" y1="980" x2="976" y2="980" stroke="#DCE5E8" stroke-width="1"/><rect x="1016" y="662" width="388" height="340" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="1038" y="694" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Diễn giải và bằng chứng</text><text x="1038" y="727" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">15.000 + 4.000 − 2.000 − 1.000</text><text x="1038" y="757" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">= 16.000 tỷ đồng CFO.</text><text x="1038" y="787" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Tổng trung gian chỉ dùng đối chiếu.</text><text x="1038" y="817" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Ví dụ gộp nhóm để xem trước bố cục;</text><text x="10