y="216" font-size="12" fill="#126B59" font-weight="600" text-anchor="start">Phân tích tài chính</text></g><g id="nav-saved-3" data-screen="uc3" role="button" tabindex="0" aria-label="Mở uc3" style="cursor:pointer"><rect x="12" y="244" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="272" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">03</text><text x="54" y="272" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">So sánh doanh nghiệp</text></g><g id="nav-saved-4" data-screen="uc4" role="button" tabindex="0" aria-label="Mở uc4" style="cursor:pointer"><rect x="12" y="300" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="328" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">04</text><text x="54" y="328" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">Theo dõi doanh nghiệp</text></g><g id="nav-saved-5" data-screen="uc5" role="button" tabindex="0" aria-label="Mở uc5" style="cursor:pointer"><rect x="12" y="356" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="384" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">05</text><text x="54" y="384" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">Phân tích cổ tức</text></g><line x1="24" y1="434" x2="192" y2="434" stroke="#DCE5E8" stroke-width="1"/><text x="24" y="467" font-size="10" fill="#64767E" font-weight="600" text-anchor="start">DỮ LIỆU HỖ TRỢ</text><g id="review-nav-saved" data-screen="review" role="button" tabindex="0" aria-label="Mở review" style="cursor:pointer"><text x="24" y="502" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Duyệt và tra soát số liệu</text></g><g id="saved-nav-saved" data-screen="saved" role="button" tabindex="0" aria-label="Mở saved" style="cursor:pointer"><text x="24" y="538" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Phân tích đã lưu</text></g><rect x="16" y="893" width="184" height="116" rx="10" fill="#F3F6F7"/><text x="30" y="921" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Mẫu nghiên cứu</text><text x="30" y="946" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">3 doanh nghiệp</text><text x="30" y="971" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">BCTC năm 2023–2025</text><text x="248" y="98" font-size="11" fill="#64767E" font-weight="600" text-anchor="start">CHI TIẾT  /  Phân tích tài chính</text><text x="248" y="145" font-size="29" fill="#182F39" font-weight="600" text-anchor="start">Phân tích đã lưu và nhận xét</text><text x="248" y="176" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Mở lại đúng bộ số, nguồn và bối cảnh đã dùng; tiếp tục nghiên cứu từ câu hỏi đã ghi.</text><line x1="248" y1="1031" x2="1404" y2="1031" stroke="#DCE5E8" stroke-width="1"/><text x="248" y="1058" font-size="12" fill="#865A14" font-weight="500" text-anchor="start">DỮ LIỆU MINH HỌA · Số liệu giả định, chưa đối chiếu nguồn doanh nghiệp.</text><text x="1404" y="1058" font-size="11" fill="#64767E" font-weight="400" text-anchor="end">Thiết kế đề xuất · chưa triển khai</text><rect x="248" y="202" width="1156" height="64" rx="10" fill="#FFFFFF" stroke="#DCE5E8"/><rect x="264" y="214" width="285" height="40" rx="7" fill="#F3F6F7"/><text x="278" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">HPG · Hòa Phát</text><rect x="565" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="579" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">2023 — 2025</text><rect x="771" y="214" width="226" height="40" rx="7" fill="#F3F6F7"/><text x="785" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">BCTC năm · Hợp nhất</text><rect x="1013" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="1027" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">Hồ sơ minh họa</text><text x="1378" y="239" font-size="12" fill="#126B59" font-weight="600" text-anchor="end">Đổi bộ chọn</text><rect x="248" y="290" width="410" height="707" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="270" y="322" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Hồ sơ đã lưu</text><rect x="270" y="363" width="366" height="112" rx="8" fill="#E6F4EE"/><text x="287" y="397" font-size="13" fill="#182F39" font-weight="600" text-anchor="start">HPG · Lợi nhuận và CFO</text><text x="287" y="426" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">2023–2025 · hợp nhất</text><text x="287" y="451" font-size="11" fill="#64767E" font-weight="400" text-anchor="start">Bản lưu mẫu · chưa ghi vào hệ thống</text><rect x="270" y="496" width="366" height="112" rx="8" fill="#F3F6F7"/><text x="287" y="530" font-size="13" fill="#182F39" font-weight="600" text-anchor="start">HPG / VNM / FPT · So sánh</text><text x="287" y="559" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Năm 2025 · nhóm tự chọn</text><text x="287" y="584" font-size="11" fill="#64767E" font-weight="400" text-anchor="start">Bản lưu mẫu · chưa ghi vào hệ thống</text><rect x="270" y="629" width="366" height="112" rx="8" fill="#F3F6F7"/><text x="287" y="663" font-size="13" fill="#182F39" font-weight="600" text-anchor="start">HPG · Cổ tức và dòng tiền</text><text x="287" y="692" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Dữ liệu còn thiếu cơ sở DPS</text><text x="287" y="717" font-size="11" fill="#64767E" font-weight="400" text-anchor="start">Bản lưu mẫu · chưa ghi vào hệ thống</text><rect x="678" y="290" width="726" height="707" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="700" y="322" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Nhận xét: lợi nhuận tăng có đi cùng tiền?</text><rect x="700" y="350" width="226" height="26" rx="13" fill="#E6F4EE"/><text x="711" y="368" font-size="11" fill="#126B59" font-weight="600" text-anchor="start">Giữ bản dữ liệu đã dùng</text><text x="700" y="411" font-size="15" fill="#182F39" font-weight="600" text-anchor="start">Nhận xét của người dùng</text><rect x="700" y="432" width="682" height="118" rx="8" fill="#F3F6F7"/><text x="716" y="461" font-size="14" fill="#64767E" font-weight="400" text-anchor="start">Năm 2024 LNST tăng, CFO giảm. Cần đọc thay đổi vốn lưu động</text><text x="716" y="490" font-size="14" fill="#64767E" font-weight="400" text-anchor="start">và các khoản điều chỉnh để hiểu nguyên nhân. Đây là ví dụ nhận xét,</text><text x="716" y="519" font-size="14" fill="#64767E" font-weight="400" text-anchor="start">không phải kết luận về doanh nghiệp thật.</text><text x="700" y="599" font-size="15" fill="#182F39" font-weight="600" text-anchor="start">Bằng chứng gắn với nhận xét</text><text x="700" y="636" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">LNST/CFO 2023–2025 và phiên bản số đã chọn</text><text x="700" y="667" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Nguồn từng ô và công thức có điều kiện</text><text x="700" y="698" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Cầu nối theo ca, phần thiếu và giới hạn diễn giải</text><text x="700" y="778" font-size="15" fill="#182F39" font-weight="600" text-anchor="start">Câu hỏi cần nghiên cứu tiếp</text><text x="700" y="815" font-size="14" fill="#64767E" font-weight="400" text-anchor="start">Khoản vốn lưu động nào làm CFO thay đổi?</text><text x="700" y="838" font-size="14" fill="#64767E" font-weight="400" text-anchor="start">CAPEX và phân phối đã chi tác động thế nào?</text><g id="action-97" data-screen="source" role="button" tabindex="0" aria-label="Mở source" style="cursor:pointer"><rect x="700" y="921" width="218" height="40" rx="8" fill="#FFFFFF" stroke="#DCE5E8"/><text x="809.0" y="947" font-size="13" fill="#182F39" font-weight="600" text-anchor="middle">Xem nguồn</text></g><g id="action-101" data-screen="uc2" role="button" tabindex="0" aria-label="Mở uc2" style="cursor:pointer"><rect x="936" y="921" width="216" height="40" rx="8" fill="#FFFFFF" stroke="#DCE5E8"/><text x="1044.0" y="947" font-size="13" fill="#182F39" font-weight="600" text-anchor="middle">Mở phân tích</text></g><g id="action-105"><rect x="1170" y="921" width="212" height="40" rx="8" fill="#FFFFFF" stroke="#DCE5E8"/><text x="1276.0" y="947" font-size="13" fill="#182F39" font-weight="600" text-anchor="middle">Xuất hồ sơ</text></g></g></svg>