<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" aria-label="Cơ sở cổ phiếu và tính so sánh DPS"><style>text{font-family:"Be Vietnam Pro","Segoe UI",Arial,sans-serif}[data-screen]:hover{opacity:.8}</style><g id="basis"><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F3F6F7"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#122F37"/><rect x="24" y="16" width="32" height="32" rx="8" fill="#126B59"/><text x="40" y="39" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">F</text><text x="70" y="40" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="start">NỀN TẢNG TÀI CHÍNH</text><text x="1000" y="39" font-size="12" fill="#BED1D7" font-weight="400" text-anchor="start">HPG / VNM / FPT</text><rect x="1150" y="20" width="112" height="26" rx="13" fill="#E6F4EE"/><text x="1161" y="38" font-size="11" fill="#126B59" font-weight="600" text-anchor="start">Bản thiết kế</text><text x="1355" y="40" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="start">Cá nhân</text><rect x="0" y="64" width="216" height="1016" rx="0" fill="#FFFFFF"/><line x1="216" y1="64" x2="216" y2="1080" stroke="#DCE5E8" stroke-width="1"/><text x="24" y="109" font-size="10" fill="#64767E" font-weight="600" text-anchor="start">KHÔNG GIAN NGHIÊN CỨU</text><g id="nav-basis-1" data-screen="uc1" role="button" tabindex="0" aria-label="Mở uc1" style="cursor:pointer"><rect x="12" y="132" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="160" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">01</text><text x="54" y="160" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">Dữ liệu tài chính</text></g><g id="nav-basis-2" data-screen="uc2" role="button" tabindex="0" aria-label="Mở uc2" style="cursor:pointer"><rect x="12" y="188" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="216" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">02</text><text x="54" y="216" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">Phân tích tài chính</text></g><g id="nav-basis-3" data-screen="uc3" role="button" tabindex="0" aria-label="Mở uc3" style="cursor:pointer"><rect x="12" y="244" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="272" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">03</text><text x="54" y="272" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">So sánh doanh nghiệp</text></g><g id="nav-basis-4" data-screen="uc4" role="button" tabindex="0" aria-label="Mở uc4" style="cursor:pointer"><rect x="12" y="300" width="192" height="44" rx="8" fill="#FFFFFF"/><text x="27" y="328" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">04</text><text x="54" y="328" font-size="12" fill="#182F39" font-weight="400" text-anchor="start">Theo dõi doanh nghiệp</text></g><g id="nav-basis-5" data-screen="uc5" role="button" tabindex="0" aria-label="Mở uc5" style="cursor:pointer"><rect x="12" y="356" width="192" height="44" rx="8" fill="#E6F4EE"/><text x="27" y="384" font-size="12" fill="#126B59" font-weight="600" text-anchor="start">05</text><text x="54" y="384" font-size="12" fill="#126B59" font-weight="600" text-anchor="start">Phân tích cổ tức</text></g><line x1="24" y1="434" x2="192" y2="434" stroke="#DCE5E8" stroke-width="1"/><text x="24" y="467" font-size="10" fill="#64767E" font-weight="600" text-anchor="start">DỮ LIỆU HỖ TRỢ</text><g id="review-nav-basis" data-screen="review" role="button" tabindex="0" aria-label="Mở review" style="cursor:pointer"><text x="24" y="502" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Duyệt và tra soát số liệu</text></g><g id="saved-nav-basis" data-screen="saved" role="button" tabindex="0" aria-label="Mở saved" style="cursor:pointer"><text x="24" y="538" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Phân tích đã lưu</text></g><rect x="16" y="893" width="184" height="116" rx="10" fill="#F3F6F7"/><text x="30" y="921" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">Mẫu nghiên cứu</text><text x="30" y="946" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">3 doanh nghiệp</text><text x="30" y="971" font-size="12" fill="#64767E" font-weight="400" text-anchor="start">BCTC năm 2023–2025</text><text x="248" y="98" font-size="11" fill="#64767E" font-weight="600" text-anchor="start">CHI TIẾT  /  Phân tích cổ tức</text><text x="248" y="145" font-size="29" fill="#182F39" font-weight="600" text-anchor="start">Cơ sở cổ phiếu và tính so sánh DPS</text><text x="248" y="176" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Giữ DPS gốc; chỉ điều chỉnh chuỗi khi có sự kiện và ngày hiệu lực được xác minh.</text><line x1="248" y1="1031" x2="1404" y2="1031" stroke="#DCE5E8" stroke-width="1"/><text x="248" y="1058" font-size="12" fill="#865A14" font-weight="500" text-anchor="start">DỮ LIỆU MINH HỌA · Số liệu giả định, chưa đối chiếu nguồn doanh nghiệp.</text><text x="1404" y="1058" font-size="11" fill="#64767E" font-weight="400" text-anchor="end">Thiết kế đề xuất · chưa triển khai</text><rect x="248" y="202" width="1156" height="64" rx="10" fill="#FFFFFF" stroke="#DCE5E8"/><rect x="264" y="214" width="285" height="40" rx="7" fill="#F3F6F7"/><text x="278" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">HPG · Hòa Phát</text><rect x="565" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="579" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">2023 — 2025</text><rect x="771" y="214" width="226" height="40" rx="7" fill="#F3F6F7"/><text x="785" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">BCTC năm · Hợp nhất</text><rect x="1013" y="214" width="190" height="40" rx="7" fill="#F3F6F7"/><text x="1027" y="239" font-size="13" fill="#182F39" font-weight="500" text-anchor="start">Đơn vị: tỷ đồng</text><text x="1378" y="239" font-size="12" fill="#126B59" font-weight="600" text-anchor="end">Đổi bộ chọn</text><rect x="248" y="290" width="1156" height="65" rx="10" fill="#FFF3DA"/><text x="270" y="329" font-size="14" fill="#865A14" font-weight="600" text-anchor="start">Chưa đủ cơ sở điều chỉnh. Hệ thống hiển thị lý do và giữ nguyên số DPS gốc.</text><rect x="248" y="378" width="1156" height="293" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="270" y="410" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Sự kiện cần xác minh</text><rect x="268" y="435" width="1116" height="42" rx="6" fill="#F3F6F7"/><g id="cell-72"><text x="282" y="462" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Sự kiện</text></g><g id="cell-75"><text x="577" y="462" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Tỷ lệ</text></g><g id="cell-78"><text x="742" y="462" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Ngày hiệu lực</text></g><g id="cell-81"><text x="1047" y="462" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Nguồn / trạng thái</text></g><g id="cell-84"><text x="282" y="507" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">Cổ tức bằng cổ phiếu</text></g><g id="cell-87"><text x="577" y="507" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Cần đối chiếu</text></g><g id="cell-90"><text x="742" y="507" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Chưa xác định</text></g><g id="cell-93"><text x="1047" y="507" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Cần tài liệu xác nhận</text></g><line x1="268" y1="551" x2="1384" y2="551" stroke="#DCE5E8" stroke-width="1"/><g id="cell-97"><text x="282" y="581" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">Phát hành làm thay đổi số cổ phiếu</text></g><g id="cell-100"><text x="577" y="581" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Chưa đủ dữ liệu</text></g><g id="cell-103"><text x="742" y="581" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Không dùng ngày chốt thay thế</text></g><g id="cell-106"><text x="1047" y="581" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Chưa đủ cơ sở điều chỉnh</text></g><line x1="268" y1="625" x2="1384" y2="625" stroke="#DCE5E8" stroke-width="1"/><rect x="248" y="691" width="748" height="312" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="270" y="723" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">DPS gốc và DPS tham chiếu</text><rect x="268" y="749" width="708" height="42" rx="6" fill="#F3F6F7"/><g id="cell-113"><text x="282" y="776" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">Năm lợi nhuận</text></g><g id="cell-116"><text x="502" y="776" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">DPS quan sát · đ/cp</text></g><g id="cell-119"><text x="737" y="776" font-size="12" fill="#64767E" font-weight="600" text-anchor="start">DPS tham chiếu</text></g><g id="cell-122"><text x="282" y="821" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">2023</text></g><g id="cell-125"><text x="502" y="821" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">1.200</text></g><g id="cell-128"><text x="737" y="821" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Chưa tính</text></g><line x1="268" y1="844" x2="976" y2="844" stroke="#DCE5E8" stroke-width="1"/><g id="cell-132"><text x="282" y="874" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">2024</text></g><g id="cell-135"><text x="502" y="874" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">1.500</text></g><g id="cell-138"><text x="737" y="874" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Chưa tính</text></g><line x1="268" y1="897" x2="976" y2="897" stroke="#DCE5E8" stroke-width="1"/><g id="cell-142"><text x="282" y="927" font-size="14" fill="#182F39" font-weight="600" text-anchor="start">2025</text></g><g id="cell-145"><text x="502" y="927" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">1.800 · chưa đầy đủ</text></g><g id="cell-148"><text x="737" y="927" font-size="14" fill="#182F39" font-weight="400" text-anchor="start">Chưa tính</text></g><line x1="268" y1="950" x2="976" y2="950" stroke="#DCE5E8" stroke-width="1"/><rect x="1016" y="691" width="388" height="312" rx="12" fill="#FFFFFF" stroke="#DCE5E8"/><text x="1038" y="723" font-size="16" fill="#182F39" font-weight="600" text-anchor="start">Thông tin cần bổ sung</text><text x="1038" y="755" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Loại sự kiện và đối tượng cổ phiếu</text><text x="1038" y="785" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Tỷ lệ, cơ sở quyền, quy tắc làm tròn</text><text x="1038" y="815" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Ngày hiệu lực có tài liệu xác nhận</text><text x="1038" y="845" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Không coi mọi phát hành là chia tách</text><text x="1038" y="875" font-size="13" fill="#64767E" font-weight="400" text-anchor="start">Không cộng cổ phiếu vào tiền mặt</text><g id="action-159" data-screen="uc5" role="button" tabindex="0" aria-label="Mở uc5" style="cursor:pointer"><rect x="1038" y="941" width="344" height="40" rx="8" fill="#126B59"/><text x="1210.0" y="967" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Quay lại lịch sử cổ tức</text></g></g></svg>